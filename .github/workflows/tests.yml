name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    # Real check: the stack must start and answer /web/health on each supported Odoo version.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo-version: ["17", "18", "19"]
    env:
      ODOO_VERSION: ${{ matrix.odoo-version }}
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --wait db
      - name: Initialise a database
        run: docker compose run --rm odoo odoo -d qs -i base --stop-after-init --no-http
      - run: docker compose up -d odoo
      - name: Wait for /web/health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8069/web/health && exit 0
            sleep 2
          done
          docker compose logs odoo
          exit 1
      - name: Test the example module from addons/ (make test)
        run: |
          make test MODULE=quickstart_example DB=qs 2>&1 | tee test.log
          grep -E "0 failed, 0 error\(s\) of [1-9][0-9]* tests" test.log
      - name: Update the example module (make update-module)
        run: make update-module MODULE=quickstart_example DB=qs
      - name: Test the example module on a throwaway database (make test-fresh)
        run: |
          make test-fresh MODULE=quickstart_example 2>&1 | tee fresh.log
          grep -E "0 failed, 0 error\(s\) of [1-9][0-9]* tests" fresh.log
          # The database must be gone once the tests pass.
          test "$(docker compose exec -T db psql -U odoo -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname = 'test_quickstart_example'")" = 0
      - if: always()
        run: docker compose down -v
