[options]
; Modules personnalisés : déposez-les dans ./addons
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Les accès PostgreSQL viennent des variables PG* du docker-compose.yml.
; Mot de passe maître du gestionnaire de bases : à définir avant toute mise en ligne.
; admin_passwd = changez-moi
proxy_mode = False
list_db = True
log_level = info
